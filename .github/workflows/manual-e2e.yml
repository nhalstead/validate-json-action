name: Manual E2E Tests

on:
  workflow_dispatch:
    inputs:
      run_valid:
        description: 'Run Valid JSON Test'
        type: boolean
        default: true
      run_invalid:
        description: 'Run Invalid JSON Test'
        type: boolean
        default: true

jobs:
  test-valid:
    name: Valid JSON
    if: inputs.run_valid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Patch action.yml to build from local Dockerfile
        run: |
          sed -i "s|image: 'docker://.*'|image: 'Dockerfile'|g" action.yml

      - name: Run Action locally
        uses: ./
        with:
          schema: "./__tests__/mocks/schema/valid.json"
          jsons: "./__tests__/mocks/tested-data/valid.json"

  test-invalid:
    name: Invalid JSON
    if: inputs.run_invalid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Patch action.yml to build from local Dockerfile
        run: |
          sed -i "s|image: 'docker://.*'|image: 'Dockerfile'|g" action.yml

      - name: Run Action locally
        id: run-action
        continue-on-error: true
        uses: ./
        with:
          schema: "./__tests__/mocks/schema/valid.json"
          jsons: "./__tests__/mocks/tested-data/invalid_by_schema.json"

      - name: Check outcome
        if: steps.run-action.outcome != 'failure'
        run: |
          echo "Expected the action to fail with invalid JSON, but it succeeded."
          exit 1
